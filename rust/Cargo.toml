[package]
name = "libikarus"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
camino = "1.2.5"
chromiumoxide = "0.9.1"
flutter_rust_bridge = "=2.12.0"
paste = "1.0.15"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
rig = "0.41.0"
serde = "1.0.229"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "signal", "sync"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
